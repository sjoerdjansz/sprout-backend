# Database credentials are read from the Laravel .env in this directory.
services:
  php:
    build: ./docker/php
    volumes:
      - ./:/var/www/html
    depends_on:
      - mariadb
      - mailpit

  # Runs queued jobs, such as generating flashcards and questions. queue:listen boots the app for every job,
  # so code changes are picked up without a restart. Its timeout matches the longest job.
  queue:
    build: ./docker/php
    command: php artisan queue:listen --timeout=180
    volumes:
      - ./:/var/www/html
    depends_on:
      - mariadb
    restart: unless-stopped

  # Runs scheduled tasks, such as pruning attachments that were uploaded but never sent.
  scheduler:
    build: ./docker/php
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    depends_on:
      - mariadb
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

volumes:
  dbdata:
